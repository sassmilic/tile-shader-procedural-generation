<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tile Shader Sandbox</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1d1d1f; color: #eee;
                 font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
    body { display: flex; flex-direction: column; align-items: center; }
    #stage { position: relative; margin-top: 12px; }
    #stage canvas { position: absolute; left: 0; top: 0; display: block; }
    #overlay { pointer-events: none; }
    #status { margin: 8px 0; display: flex; gap: 24px; }
    #status b { color: #ffb38a; }
    #error { position: fixed; left: 12px; right: 12px; bottom: 12px; display: none;
             background: #3a0d0d; color: #ffb4b4; border: 1px solid #a33; padding: 10px 12px;
             white-space: pre-wrap; max-height: 40vh; overflow: auto; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="gl"></canvas>
    <canvas id="overlay"></canvas>
  </div>
  <div id="status">
    <span>hover: <b id="hover">—</b></span>
    <span id="reload">shader: loading…</span>
  </div>
  <pre id="error"></pre>
  <script src="main.js"></script>
</body>
</html>
