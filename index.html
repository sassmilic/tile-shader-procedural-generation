<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tile Build Animation</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;600&display=swap">
  <style>
    :root { --bg: #ffffff; --code: #a6a6a6; --label: #555555; --line: #e3e3e3; --pink: #ff1493;
            --pad-top: 72px; --pad-bottom: 40px; --q-font: 20px; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--label);
                 font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
    body { display: flex; gap: 32px; justify-content: center; align-items: flex-start;
           padding: var(--pad-top) 16px var(--pad-bottom); box-sizing: border-box; flex-wrap: wrap; }
    #left { display: flex; flex-direction: column; gap: 10px; }
    #stage { background: var(--bg); outline: 1px solid #000; }   /* marks the image area */
    #gl { display: block; }
    #controls { display: flex; gap: 10px; }
    #controls button {   /* white circles, thin black outline, black icons */
      width: 40px; height: 40px; border-radius: 50%; border: 1px solid #000; padding: 0; cursor: pointer;
      background: #fff; color: #000; display: grid; place-items: center; }
    #controls button svg { width: 18px; height: 18px; fill: currentColor; }
    #controls button[hidden] { display: none; }   /* the local-only skip button */
    /* play / pause is one button: it shows what a click will do */
    #play:not(.paused) svg path:first-child, #play.paused svg path:last-child { display: none; }
    #controls button:hover { background: #f2f2f2; }
    #controls button:active { background: #000; color: #fff; }
    /* the byte counter: a Vim command line under the code, with a blinking block cursor */
    #size { flex: none; margin-top: 10px; height: 40px; font: 20px/40px Inconsolata, ui-monospace, Menlo, monospace;
            color: var(--pink); white-space: nowrap; }   /* level with the buttons, under the code */
    #size .blk { animation: blink 1s steps(1) infinite; margin-left: 1px; }
    #toggle { position: absolute; right: 0; bottom: 100%; margin-bottom: 12px; z-index: 2;   /* above the code area, flush right */
      background: #fff; color: #000; border: 1px solid #000; border-radius: 0;
      font: var(--q-font)/1 Inconsolata, ui-monospace, Menlo, monospace; padding: .5em .85em; cursor: pointer; }
    #toggle:hover { background: #000; color: #fff; }
    /* hidden until the code is fully written (animate.js adds .shown) */
    #toggle { opacity: 0; visibility: hidden; transition: opacity 0.6s, visibility 0s 0.6s; }
    #toggle.shown { opacity: 1; visibility: visible; transition: opacity 0.6s; }
    #panel { position: relative; width: 560px; max-width: 100%; display: flex; flex-direction: column; }
    /* the code (or the questions) is exactly as tall as the square: --img is set by resize() */
    #code, #qpanel { flex: none; height: var(--img, 480px); }
    #panel.q #code { display: none; }
    #panel:not(.q) #qpanel { display: none; }
    /* the questions: plain text, one size, one colour */
    #qpanel { overflow-y: auto; color: #222; font-size: 15px; line-height: 1.55;
              font-family: Inconsolata, ui-monospace, Menlo, monospace; }
    #qpanel h1, #qpanel h2 { font-size: inherit; font-weight: normal; margin: 0 0 1em; }   /* no bold anywhere */
    #qpanel h2 { margin-top: 1.75em; color: #888; }
    #qpanel p, #qpanel .diagram { margin: 0 0 1.5em; }
    #qpanel .diagram img { display: block; width: min(100%, 220px); height: auto; }
    #qpanel ol { padding-left: 2.6em; margin: 0 0 1.5em; }
    #qpanel ol li { margin-bottom: .75em; }
    #qpanel .more { margin: .4em 0 0; padding: .55em .8em; background: #f3f3f3; color: #444; }   /* a question's explanation */
    /* footnotes keep their colour: pink markers and links, the note you jumped to highlighted */
    #qpanel sup a { color: var(--pink); text-decoration: none; font-size: 11px; padding-left: 2px; }
    #qpanel .notes { padding: 0 0 0 2.6em; list-style: none; margin: 1.5em 0; }
    #qpanel .notes li { margin-bottom: .75em; position: relative; }
    #qpanel .notes .lbl { position: absolute; right: 100%; padding-right: 0.6em; white-space: nowrap; }
    #qpanel .notes li:target, #qpanel .note-ref:target { background: #ffe8f3; }
    #qpanel a { color: var(--pink); }
    #qpanel .note-back { color: #a51262; margin-inline-start: .75em; white-space: nowrap; }
    /* --code-size: 13px at most, smaller when the finished program wouldn't fit the square (resize() in animate.js) */
    #code { margin: 0; overflow-y: auto; font-size: var(--code-size, 13px); line-height: 1.55; color: var(--code);
            /* a thin band down the right edge, like Vim's colorcolumn; the code wraps before it */
            padding-right: 14px; box-sizing: border-box;
            background: linear-gradient(to left, transparent 0, transparent 1px, #ececec 1px, #ececec 4px, transparent 4px); }
    #code .ln { white-space: pre-wrap; word-break: break-word; }
    #code .ln.in { padding-left: 6ch; text-indent: -2ch; }   /* body lines: 4ch indent, wraps hang 2ch further */
    #code .ln.cur { background: #ffe8f3; }   /* vim-style cursor line */
    #code .caret { animation: blink 0.8s steps(1) infinite; }
    #code .mp { background: var(--pink); color: #fff; }   /* Vim's matching bracket, as a ) is typed */
    /* a clock-driven line's current value, as a comment after it (not counted in the bytes) */
    #code .vt { color: #c8c8c8; margin-left: 3ch; display: inline-block; white-space: nowrap; text-indent: 0; }
    #code .tl { display: flex; color: #c8c8c8; }   /* Vim's ~ for the rows past the end of the file */
    #code .tl .intro { flex: 1; text-align: center; padding-right: 1ch; color: var(--code); }
    #code .tl .intro.t { color: var(--label); }   /* the welcome screen's title */
    @keyframes blink { 50% { opacity: 0; } }
    /* ---- phones ----
       portrait: the layout needs width, so ask for landscape instead */
    #rotate { display: none; }
    @media (orientation: portrait) and (max-width: 600px) {
      #rotate { display: flex; position: fixed; inset: 0; z-index: 10; background: var(--bg); color: #000;
                flex-direction: column; align-items: center; justify-content: center; gap: 22px;
                text-align: center; padding: 24px; font-size: 15px; }
      #rotate .icon { font-size: 56px; line-height: 1; }
      #rotate p { margin: 0; max-width: 24ch; }
      body > :not(#rotate) { visibility: hidden; }
    }
    /* landscape on a phone (short screen): animation left, code right, everything tighter */
    @media (max-height: 500px) {
      /* the square takes the full height: the buttons stand in a column to its left, the
         ????????? button sits in the code's top-right corner, the command line under the code */
      :root { --pad-top: 8px; --pad-bottom: 8px; --q-font: 11px; }
      body { flex-wrap: nowrap; gap: 14px; height: 100dvh;
             padding-left: max(10px, env(safe-area-inset-left)); padding-right: max(10px, env(safe-area-inset-right)); }
      #left { flex: none; flex-direction: row-reverse; align-items: flex-start; gap: 8px; }
      #controls { flex-direction: column; gap: 8px; }
      #controls button { width: 30px; height: 30px; }
      #controls button svg { width: 14px; height: 14px; }
      #panel { flex: 1; min-width: 0; width: auto; }
      #code, #qpanel { height: calc(var(--img, 300px) - 36px); }   /* the command line (30px + 6px) fits under it */
      /* the ????????? button: a round "?" at the bottom of the button column ("×" back to the code) */
      #toggle { position: fixed; right: auto; left: max(10px, env(safe-area-inset-left)); bottom: var(--pad-bottom); margin: 0;
                width: 30px; height: 30px; padding: 0; border-radius: 50%; font-size: 0; display: grid; place-items: center; }
      #toggle::before { content: '?'; font-size: 15px; }
      #panel.q #toggle::before { content: '×'; }
      #code { font-size: var(--code-size, 11px); line-height: 1.45; }
      #qpanel { font-size: 13px; }
      #size { font-size: 13px; margin-top: 6px; height: 30px; line-height: 30px; }
    }
    #error { position: fixed; left: 12px; right: 12px; bottom: 12px; display: none;
             background: #fff0f3; color: #a3002c; border: 1px solid #f0a; padding: 10px 12px;
             white-space: pre-wrap; max-height: 40vh; overflow: auto; }
  </style>
</head>
<body>
  <div id="rotate" role="alert">
    <div class="icon" aria-hidden="true">↻</div>
    <p>Rotate your phone</p>
  </div>
  <div id="left">
    <div id="stage"><canvas id="gl"></canvas></div>
    <div id="controls">
      <button id="rewind" title="rewind" aria-label="rewind"><svg viewBox="0 0 24 24"><path d="M11.5 5v14L2 12zM22 5v14l-9.5-7z"/></svg></button>
      <button id="play" title="pause (space)" aria-label="pause"><svg viewBox="0 0 24 24"><path d="M7 4.5v15L20 12z"/><path d="M6 5h4.5v14H6zM13.5 5H18v14h-4.5z"/></svg></button>
      <!-- local testing only (shown on localhost): skip the build, straight to the finished mosaic -->
      <button id="skip" title="skip to the finished mosaic" aria-label="skip to the end" hidden><svg viewBox="0 0 24 24"><path d="M3 5v14l9-7zM12 5v14l9-7z"/><rect x="19.5" y="5" width="2" height="14"/></svg></button>
    </div>
  </div>
  <div id="panel">
    <button id="toggle" title="switch between the code and the questions">?????????</button>
    <pre id="code"></pre>
    <section id="qpanel"></section>   <!-- filled from questions.md -->
    <div id="size"></div>
  </div>
  <pre id="error"></pre>
  <script src="renderer.js"></script>
  <script src="animate.js"></script>
  <script>
    const panel = document.getElementById('panel'), toggle = document.getElementById('toggle');
    const qpanel = document.getElementById('qpanel');
    const show = (q) => { panel.classList.toggle('q', q); toggle.textContent = q ? 'Code' : '?????????';
      if (q) toggle.classList.add('shown'); };   // always a way back from the questions
    toggle.onclick = () => { const q = !panel.classList.contains('q'); show(q);
      history.replaceState(null, '', q ? '#questions' : location.pathname + location.search); };
    function scrollToQuestionAnchor() {
      const target = document.getElementById(location.hash.slice(1));
      if (target && qpanel.contains(target)) target.scrollIntoView({ block: 'start' });
    }
    function syncQuestionsPanel() {
      const wasOpen = panel.classList.contains('q');
      const isOpen = location.hash === '#questions' || /^#(?:n|r)-/.test(location.hash);
      show(isOpen);
      if (isOpen && !wasOpen) scrollToQuestionAnchor();
    }
    window.addEventListener('hashchange', syncQuestionsPanel);
    syncQuestionsPanel();

    // ---- the Questions panel, from questions.md (live: re-read when it's saved) ----
    // Headings, prose, local SVGs, numbered questions and "[^label]: ..." notes.
    // Indented lines continue a question or note. Inline: [^label], *italic*, [text](url).
    const escHtml = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const noteId = (label) => 'n-' + encodeURIComponent(label);
    function inline(text, references) {
      const refs = [];
      let h = escHtml(text.replace(/\[\^([^\]]+)\]/g, (_, label) => {
        const ids = references.get(label) || [];
        const id = `r-${encodeURIComponent(label)}-${ids.length + 1}`;
        ids.push(id);
        references.set(label, ids);
        const marker = `<sup><a class="note-ref" id="${id}" href="#${noteId(label)}" aria-label="Note ${escHtml(label)}">${escHtml(label)}</a></sup>`;
        return `\u0000${refs.push(marker) - 1}\u0000`;
      }));
      h = h.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      h = h.replace(/\*([^*\s][^*]*?)\*/g, '<i>$1</i>');
      return h.replace(/\u0000(\d+)\u0000/g, (_, i) => refs[i]);
    }
    function renderQuestions(md) {
      const blocks = [], notes = [], references = new Map();
      let last = null, nextQuestion = 1;
      for (const raw of md.split('\n')) {
        const line = raw.trim();
        let m;
        if (!line) { last = null; continue; }
        if (last?.type === 'question' && /^\s/.test(raw)) {
          last.more += (last.more ? ' ' : '') + line;
          continue;
        }
        if (last?.type === 'note' && /^\s/.test(raw)) {
          last.text += ' ' + line;
          continue;
        }
        if ((m = line.match(/^(#{1,2})\s+(.*)/))) {
          blocks.push({ type: 'heading', level: m[1].length, text: m[2] });
          last = null;
        } else if ((m = line.match(/^\[\^([^\]]+)\]:\s*(.*)/))) {
          last = { type: 'note', label: m[1], text: m[2] };
          notes.push(last);
        } else if ((m = line.match(/^\d+[.)]\s+(.*)/))) {
          let list = blocks.at(-1);
          if (list?.type !== 'list') {
            list = { type: 'list', start: nextQuestion, items: [] };
            blocks.push(list);
          }
          last = { type: 'question', text: m[1], more: '' };
          list.items.push(last);
          nextQuestion++;
        } else if ((m = line.match(/^!\[([^\]]+)\]\(([\w-]+(?:\/[\w-]+)*\.svg)\)$/i))) {
          blocks.push({ type: 'diagram', alt: m[1], src: m[2] });
          last = null;
        } else if (last?.type === 'paragraph') {
          last.text += ' ' + line;
        } else {
          last = { type: 'paragraph', text: line };
          blocks.push(last);
        }
      }
      const body = blocks.map((block) => {
        if (block.type === 'heading') return `<h${block.level}>${inline(block.text, references)}</h${block.level}>`;
        if (block.type === 'paragraph') return `<p>${inline(block.text, references)}</p>`;
        if (block.type === 'diagram') {
          return `<figure class="diagram"><img src="${block.src}" alt="${escHtml(block.alt)}" width="220" height="220"></figure>`;
        }
        const items = block.items.map((q) => {
          const prompt = inline(q.text, references);
          const more = q.more ? `<div class="more">${inline(q.more, references)}</div>` : '';
          return `<li>${prompt}${more}</li>`;
        }).join('');
        return `<ol start="${block.start}">${items}</ol>`;
      }).join('');
      if (!notes.length) return body;

      const noteBodies = notes.map((note) => inline(note.text, references));
      const noteList = notes.map(({ label }, i) => {
        const ids = references.get(label) || [];
        const backlinks = ids.map((id, index) => {
          const suffix = ids.length > 1 ? ` ${index + 1}` : '';
          return ` <a class="note-back" href="#${id}">↩ Back to text${suffix}</a>`;
        }).join('');
        const number = escHtml(label) + (/^\w+$/.test(label) ? '.' : '');
        return `<li id="${noteId(label)}" tabindex="-1"><span class="lbl">${number}</span>${noteBodies[i]}${backlinks}</li>`;
      }).join('');
      return body + `<h2>Notes</h2><ul class="notes">${noteList}</ul>`;
    }
    async function loadQuestions() {
      try {
        const res = await fetch('questions.md', { cache: 'no-store' });
        if (!res.ok) throw new Error(res.status);
        qpanel.innerHTML = renderQuestions(await res.text());
        scrollToQuestionAnchor();
      } catch (e) {
        qpanel.textContent = 'could not load questions.md (' + e.message + ')';
      }
    }
    onFileChange((name) => { if (name === 'questions.md') loadQuestions(); });
    loadQuestions();
  </script>
</body>
</html>
