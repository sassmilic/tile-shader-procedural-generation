<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tile Build Animation</title>
  <style>
    :root { --bg: #1d1d1f; --panel: #26262a; --ink: #e8e8ea; --muted: #8d8d95; --accent: #ffb38a;
            --num: #9fd3ff; --fn: #c5a3ff; --cm: #7d8b6a; --stage: #6e6e70; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
                 font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
    body { display: flex; gap: 20px; justify-content: center; align-items: flex-start;
           padding: 16px; box-sizing: border-box; flex-wrap: wrap; }
    #left { display: flex; flex-direction: column; gap: 10px; }
    #stage { background: var(--stage); border-radius: 6px; overflow: hidden; }
    #gl { display: block; }
    #controls { display: flex; align-items: center; gap: 8px; }
    #controls button, #controls select {
      background: var(--panel); color: var(--ink); border: 1px solid #3a3a40; border-radius: 4px;
      font: inherit; padding: 4px 10px; cursor: pointer; }
    #controls button:hover { background: #303036; }
    #scrub { flex: 1; accent-color: var(--accent); }
    #panel { width: 400px; max-width: 100%; background: var(--panel); border-radius: 6px; padding: 16px 18px;
             box-sizing: border-box; }
    #counter { color: var(--muted); font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; }
    #title { font-size: 16px; margin: 6px 0 14px; color: var(--accent); }
    #code { margin: 0; white-space: pre-wrap; word-break: break-word; font-size: 13px;
            background: #1b1b1e; border-radius: 4px; padding: 12px; }
    #code .n { color: var(--num); }
    #code .f { color: var(--fn); }
    #code .c { color: var(--cm); }
    #hint { color: var(--muted); font-size: 12px; margin-top: 14px; }
    #hint a { color: #8ab4ff; }
    #error { position: fixed; left: 12px; right: 12px; bottom: 12px; display: none;
             background: #3a0d0d; color: #ffb4b4; border: 1px solid #a33; padding: 10px 12px;
             white-space: pre-wrap; max-height: 40vh; overflow: auto; }
  </style>
</head>
<body>
  <div id="left">
    <div id="stage"><canvas id="gl"></canvas></div>
    <div id="controls">
      <button id="prev" title="previous step (←)">«</button>
      <button id="play" title="play / pause (space)">❚❚</button>
      <button id="next" title="next step (→)">»</button>
      <input id="scrub" type="range" min="0" max="1" step="0.01" value="0">
      <select id="speed" title="speed">
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
      </select>
    </div>
  </div>
  <div id="panel">
    <div id="counter"></div>
    <div id="title"></div>
    <pre id="code"></pre>
    <div id="hint">Space plays or pauses. ← → move between steps. The code is read live from
      <code>shader.frag</code>. <a href="index.html">Back to the tile</a></div>
  </div>
  <pre id="error"></pre>
  <script src="renderer.js"></script>
  <script src="animate.js"></script>
</body>
</html>
