<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tile Build Animation</title>
  <style>
    :root { --bg: #ffffff; --code: #a6a6a6; --label: #555555; --line: #e3e3e3; --pink: #ff1493; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--label);
                 font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
    body { display: flex; gap: 32px; justify-content: center; align-items: flex-start;
           padding: 16px; box-sizing: border-box; flex-wrap: wrap; }
    #left { display: flex; flex-direction: column; gap: 10px; }
    #stage { background: var(--bg); }
    #gl { display: block; }
    #controls { display: flex; gap: 6px; }
    #controls button {
      background: #fff; color: #000; border: 1px solid #000; border-radius: 0;
      font: 13px/1 ui-monospace, Menlo, monospace; padding: 4px 8px; cursor: pointer; }
    #controls button:active { background: #000; color: #fff; }
    #size { color: #c4c4c4; font-size: 12px; margin: 8px 0 4px; }
    #panel { width: 560px; max-width: 100%; display: flex; flex-direction: column;
             height: calc(100vh - 32px); }
    #code { margin: 0; flex: 1; overflow-y: auto; font-size: 16px; line-height: 1.55; color: var(--code); }
    #code .ln { white-space: pre-wrap; word-break: break-word; }
    #code .ln.in { padding-left: 6ch; text-indent: -2ch; }   /* body lines: 4ch indent, wraps hang 2ch further */
    #code .ln.cur { background: #ffe8f3; }   /* vim-style cursor line */
    #code .caret { animation: blink 0.8s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    #hint { color: #b5b5b5; font-size: 11px; margin-top: 10px; }
    #hint a { color: var(--pink); }
    #error { position: fixed; left: 12px; right: 12px; bottom: 12px; display: none;
             background: #fff0f3; color: #a3002c; border: 1px solid #f0a; padding: 10px 12px;
             white-space: pre-wrap; max-height: 40vh; overflow: auto; }
  </style>
</head>
<body>
  <div id="left">
    <div id="stage"><canvas id="gl"></canvas></div>
    <div id="controls">
      <button id="rewind" title="rewind">◀◀</button>
      <button id="play" title="play">▶</button>
      <button id="stop" title="stop">■</button>
    </div>
  </div>
  <div id="panel">
    <pre id="code"></pre>
    <div id="size"></div>
    <div id="hint"><a href="test.html">Test bed</a> · <a href="index.html">The tile</a></div>
  </div>
  <pre id="error"></pre>
  <script src="renderer.js"></script>
  <script src="animate.js"></script>
</body>
</html>
